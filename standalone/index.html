64,era:"古代",level:3},{id:"shiji_baorenan",title:"司马迁 · 报任安书（节选）",author:"司马迁",note:"载于《汉书》· 千古名句",text:"人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。亦欲以究天人之际，通古今之变，成一家之言。",count:46,era:"古代",level:1}]},{id:"诸子散文",name:"诸子散文",era:"古代",items:[{id:"zhuzi_lunyu",title:"论语（节选）",author:"",note:"文言短句",text:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？学而不思则罔，思而不学则殆。三人行，必有我师焉。",count:47,era:"古代",level:2},{id:"zhuzi_mengzi",title:"孟子 · 生于忧患（节选）",author:"孟轲",note:"排比长句",text:"故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。",count:54,era:"古代",level:2},{id:"zhuzi_zhuangzi",title:"庄子 · 逍遥游（节选）",author:"庄周",note:"想象奇崛 · 重复句式",text:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。",count:56,era:"古代",level:3},{id:"zhuzi_laozi",title:"老子 · 上善若水（节选）",author:"",note:"短句 · 适合初学",text:"上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。",count:54,era:"古代",level:2},{id:"zhuzi_xunzi",title:"荀子 · 劝学（节选）",author:"荀况",note:"比喻连用",text:"君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。",count:48,era:"古代",level:2},{id:"zhuzi_sunzi",title:"孙子兵法 · 始计（节选）",author:"孙武",note:"四字格为主",text:"兵者，国之大事，死生之地，存亡之道，不可不察也。故经之以五事，校之以计，而索其情：一曰道，二曰天，三曰地，四曰将，五曰法。",count:61,era:"古代",level:2}]},{id:"古文名篇",name:"古文名篇",era:"古代",items:[{id:"guwen_loushiming",title:"陋室铭（节选）",author:"刘禹锡",note:"骈句 · 对仗工整",text:"山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。",count:54,era:"古代",level:2},{id:"guwen_chushibiao",title:"出师表（节选）",author:"诸葛亮",note:"表文 · 自述身世",text:"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中。",count:49,era:"古代",level:4},{id:"guwen_taohuayuan",title:"桃花源记（节选）",author:"陶渊明",note:"写景名段 · 四字句多",text:"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。",count:50,era:"古代",level:3},{id:"guwen_tengwangge",title:"滕王阁序（节选）",author:"王勃",note:"骈文名句",text:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",count:40,era:"古代",level:3},{id:"guwen_yueyanglou",title:"岳阳楼记（节选）",author:"范仲淹",note:"长篇 · 名句收束",text:"不以物喜，不以己悲；居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰：先天下之忧而忧，后天下之乐而乐乎。",count:68,era:"古代",level:2},{id:"guwen_ailian",title:"爱莲说（节选）",author:"周敦颐",note:"托物言志",text:"予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。",count:49,era:"古代",level:3},{id:"guwen_chibifu",title:"赤壁赋（节选）",author:"苏轼",note:"赋体 · 对偶句",text:"寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。",count:56,era:"古代",level:4}]},{id:"唐诗",name:"唐诗",era:"古代",items:[{id:"tang_jingyesi",title:"静夜思",author:"李白",note:"五言绝句 · 20 字",text:"床前明月光，疑是地上霜。举头望明月，低头思故乡。",count:24,era:"古代",level:1},{id:"tang_chunxiao",title:"春晓",author:"孟浩然",note:"五言绝句 · 20 字",text:"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。",count:24,era:"古代",level:2},{id:"tang_dengguanquelou",title:"登鹳雀楼",author:"王之涣",note:"五言绝句 · 20 字",text:"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。",count:24,era:"古代",level:1},{id:"tang_wanglushan",title:"望庐山瀑布",author:"李白",note:"七言绝句 · 28 字",text:"日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。",count:32,era:"古代",level:2},{id:"tang_jueju",title:"绝句",author:"杜甫",note:"七言绝句 · 28 字",text:"两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。",count:32,era:"古代",level:3},{id:"tang_jiangxue",title:"江雪",author:"柳宗元",note:"五言绝句 · 20 字",text:"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。",count:24,era:"古代",level:3},{id:"tang_minnong",title:"悯农",author:"李绅",note:"五言绝句 · 20 字",text:"锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。",count:24,era:"古代",level:2}]},{id:"宋词",name:"宋词",era:"古代",items:[{id:"song_rumengling",title:"如梦令",author:"李清照",note:"小令 · 长短句断行练习",text:"昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。",count:40,era:"古代",level:3},{id:"song_bosuanzi",title:"卜算子",author:"李之仪",note:"上下阕 · 重复字多",text:"我住长江头，君住长江尾。日日思君不见君，共饮长江水。此水几时休，此恨何时已。只愿君心似我心，定不负相思意。",count:53,era:"古代",level:2},{id:"song_huanxisha",title:"浣溪沙",author:"晏殊",note:"小令 · 对仗句",text:"一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。",count:48,era:"古代",level:3}]},{id:"蒙学",name:"蒙学",era:"古代",items:[{id:"meng_sanzijing",title:"三字经（节选）",author:"",note:"三字句 · 适合初学",text:"人之初，性本善。性相近，习相远。苟不教，性乃迁。教之道，贵以专。昔孟母，择邻处。子不学，断机杼。",count:48,era:"古代",level:2},{id:"meng_qianziwen",title:"千字文（节选）",author:"",note:"四字句 · 字不重复",text:"天地玄黄，宇宙洪荒。日月盈昃，辰宿列张。寒来暑往，秋收冬藏。闰余成岁，律吕调阳。",count:40,era:"古代",level:4},{id:"meng_dizigui",title:"弟子规（节选）",author:"",note:"三字句 · 结构整齐",text:"弟子规，圣人训。首孝悌，次谨信。泛爱众，而亲仁。有余力，则学文。",count:32,era:"古代",level:2}]},{id:"成语",name:"成语",era:"古代",items:[{id:"idiom_common",title:"常用成语（一）",author:"",note:"四字格 · 连续临写",text:"一心一意三思而行四面八方五光十色六神无主七上八下九牛一毛十全十美百发百中千军万马万象更新日新月异",count:48,era:"古代",level:2},{id:"idiom_effort",title:"勤学成语（二）",author:"",note:"四字格 · 连续临写",text:"业精于勤循序渐进持之以恒温故知新融会贯通举一反三学以致用厚积薄发精益求精水滴石穿",count:40,era:"古代",level:3}]},{id:"现代散文",name:"现代散文",era:"现代",items:[{id:"modern_congcong",title:"匆匆（节选）",author:"朱自清",note:"1930 年代白话 · 排比句",text:"燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？",count:63,era:"现代",level:2},{id:"modern_beiying",title:"背影（节选）",author:"朱自清",note:"动作描写 · 名段",text:"我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去，尚不大难。",count:46,era:"现代",level:2},{id:"modern_hetang",title:"荷塘月色（节选）",author:"朱自清",note:"写景 · 叠词多",text:"曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花。",count:54,era:"现代",level:2},{id:"modern_qiuye",title:"秋夜（节选）",author:"鲁迅",note:"《野草》开篇 · 短句",text:"在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。这上面的夜的天空，奇怪而高，我生平没有见过这样奇怪而高的天空。",count:63,era:"现代",level:2},{id:"modern_baicaoyuan",title:"从百草园到三味书屋（节选）",author:"鲁迅",note:"不必说句式 · 名段",text:"不必说碧绿的菜畦，光滑的石井栏，高大的皂荚树，紫红的桑椹；也不必说鸣蝉在树叶里长吟，肥胖的黄蜂伏在菜花上。",count:53,era:"现代",level:3},{id:"modern_jinan",title:"济南的冬天（节选）",author:"老舍",note:"口语化白话 · 温润",text:"设若单单是有阳光，那也算不了出奇。请闭上眼睛想：一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒。",count:63,era:"现代",level:2},{id:"modern_lahuasheng",title:"落花生（节选）",author:"许地山",note:"借物说理 · 短篇",text:"花生的好处很多，有一样最可贵：它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝头上。",count:54,era:"现代",level:2},{id:"modern_gudou",title:"故都的秋（节选）",author:"郁达夫",note:"开篇 · 长短语交错",text:"秋天，无论在什么地方的秋天，总是好的；可是啊，北国的秋，却特别地来得清，来得静，来得悲凉。我的不远千里，要从杭州赶上青岛。",count:61,era:"现代",level:2},{id:"modern_hulanhe",title:"呼兰河传（节选）",author:"萧红",note:"北方风物 · 白描",text:"严冬一封锁了大地的时候，则大地满地裂着口。从南到北，从东到西，几尺长的，一丈长的，还有好几丈长的，它们毫无方向地，便随时随地只要严冬一到，大地就裂开口了。",count:77,era:"现代",level:2}]},{id:"现代诗歌",name:"现代诗歌",era:"现代",items:[{id:"modern_zaibie",title:"再别康桥（节选）",author:"徐志摩",note:"新格律诗 · 反复句",text:"轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。那河畔的金柳，是夕阳中的新娘；波光里的艳影，在我的心头荡漾。",count:60,era:"现代",level:2},{id:"modern_sishui",title:"死水（节选）",author:"闻一多",note:"三美主张 · 整齐句",text:"这是一沟绝望的死水，清风吹不起半点漪沦！不如多扔些破铜烂铁，爽性泼你的剩菜残羹。也许铜的要绿成翡翠，铁罐上锈出几瓣桃花。",count:60,era:"现代",level:3},{id:"modern_yuxiang",title:"雨巷（节选）",author:"戴望舒",note:"象征派 · 长句",text:"撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷，我希望逢着一个丁香一样地结着愁怨的姑娘。她是有丁香一样的颜色，丁香一样的芬芳。",count:62,era:"现代",level:3},{id:"modern_buxiangta",title:"教我如何不想她（节选）",author:"刘半农",note:"早期白话诗 · 短句",text:"天上飘着些微云，地上吹着些微风。啊！微风吹动了我头发，教我如何不想她？月光恋爱着海洋，海洋恋爱着月光。",count:51,era:"现代",level:2}]},{id:"现代杂文",name:"现代杂文",era:"现代",items:[{id:"modern_tici",title:"野草 · 题辞（节选）",author:"鲁迅",note:"箴言式短句",text:"当我沉默着的时候，我觉得充实；我将开口，同时感到空虚。过去的生命已经死亡。我对于这死亡有大欢喜，因为我借此知道它曾经存活。",count:61,era:"现代",level:2},{id:"modern_chabuduo",title:"差不多先生传（节选）",author:"胡适",note:"白话议论 · 反讽",text:"你知道中国最有名的人是谁？提起此人，人人皆晓，处处闻名。他姓差，名不多，是各省各县各村人氏。你一定见过他，一定听过别人谈起他。",count:63,era:"现代",level:2}]}],library_flat:[{id:"zuo_kezhuan",title:"左传 · 郑伯克段于鄢（节选）",author:"左丘明",category:"先秦史传",era:"古代",text:"初，郑武公娶于申，曰武姜。生庄公及共叔段。庄公寤生，惊姜氏，故名曰寤生，遂恶之。爱共叔段，欲立之。",note:"史传开篇 · 叙事句",level:3,chars:39},{id:"zuo_caogui",title:"左传 · 曹刿论战（节选）",author:"左丘明",category:"先秦史传",era:"古代",text:"十年春，齐师伐我。公将战，曹刿请见。其乡人曰：肉食者谋之，又何间焉？刿曰：肉食者鄙，未能远谋。",note:"名篇 · 对话句",level:3,chars:37},{id:"zuo_zhuzhiwu",title:"左传 · 烛之武退秦师（节选）",author:"左丘明",category:"先秦史传",era:"古代",text:"晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。晋军函陵，秦军氾南。佚之狐言于郑伯曰：国危矣，若使烛之武见秦君，师必退。",note:"外交辞令 · 长句",level:3,chars:47},{id:"zhanguo_zouji",title:"战国策 · 邹忌讽齐王纳谏（节选）",author:"",category:"先秦史传",era:"古代",text:"邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：我孰与城北徐公美？其妻曰：君美甚，徐公何能及君也？",note:"设喻说理 · 问句",level:3,chars:43},{id:"shiji_xiangyu",title:"史记 · 项羽本纪（节选）",author:"司马迁",category:"史记",era:"古代",text:"项籍者，下相人也，字羽。初起时，年二十四。其季父项梁，梁父即楚将项燕，为秦将王翦所戮者也。项氏世世为楚将。",note:"列传笔法 · 人物起笔",level:2,chars:44},{id:"shiji_chenshe",title:"史记 · 陈涉世家（节选）",author:"司马迁",category:"史记",era:"古代",text:"陈胜者，阳城人也，字涉。吴广者，阳夏人也，字叔。陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：苟富贵，无相忘。",note:"名篇 · 少时立志",level:3,chars:43},{id:"shiji_lianpo",title:"史记 · 廉颇蔺相如列传（节选）",author:"司马迁",category:"史记",era:"古代",text:"廉颇者，赵之良将也。赵惠文王十六年，廉颇为赵将伐齐，大破之，取阳晋，拜为上卿，以勇气闻于诸侯。蔺相如者，赵人也。",note:"合传开篇 · 句式整齐",level:2,chars:46},{id:"shiji_liguang",title:"史记 · 李将军列传（节选）",author:"司马迁",category:"史记",era:"古代",text:"传曰：其身正，不令而行；其身不正，虽令不从。其李将军之谓也？余睹李将军悛悛如鄙人，口不能道辞。及死之日，天下知与不知，皆为尽哀。",note:"太史公曰 · 名句",level:3,chars:53},{id:"shiji_baorenan",title:"司马迁 · 报任安书（节选）",author:"司马迁",category:"史记",era:"古代",text:"人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。亦欲以究天人之际，通古今之变，成一家之言。",note:"载于《汉书》· 千古名句",level:1,chars:39},{id:"zhuzi_lunyu",title:"论语（节选）",author:"",category:"诸子散文",era:"古代",text:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？学而不思则罔，思而不学则殆。三人行，必有我师焉。",note:"文言短句",level:2,chars:39},{id:"zhuzi_mengzi",title:"孟子 · 生于忧患（节选）",author:"孟轲",category:"诸子散文",era:"古代",text:"故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。",note:"排比长句",level:2,chars:46},{id:"zhuzi_zhuangzi",title:"庄子 · 逍遥游（节选）",author:"庄周",category:"诸子散文",era:"古代",text:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。",note:"想象奇崛 · 重复句式",level:3,chars:46},{id:"zhuzi_laozi",title:"老子 · 上善若水（节选）",author:"",category:"诸子散文",era:"古代",text:"上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，正善治，事善能，动善时。",note:"短句 · 适合初学",level:2,chars:43},{id:"zhuzi_xunzi",title:"荀子 · 劝学（节选）",author:"荀况",category:"诸子散文",era:"古代",text:"君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。",note:"比喻连用",level:2,chars:37},{id:"zhuzi_sunzi",title:"孙子兵法 · 始计（节选）",author:"孙武",category:"诸子散文",era:"古代",text:"兵者，国之大事，死生之地，存亡之道，不可不察也。故经之以五事，校之以计，而索其情：一曰道，二曰天，三曰地，四曰将，五曰法。",note:"四字格为主",level:2,chars:48},{id:"guwen_loushiming",title:"陋室铭（节选）",author:"刘禹锡",category:"古文名篇",era:"古代",text:"山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。",note:"骈句 · 对仗工整",level:2,chars:44},{id:"guwen_chushibiao",title:"出师表（节选）",author:"诸葛亮",category:"古文名篇",era:"古代",text:"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中。",note:"表文 · 自述身世",level:4,chars:42},{id:"guwen_taohuayuan",title:"桃花源记（节选）",author:"陶渊明",category:"古文名篇",era:"古代",text:"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。",note:"写景名段 · 四字句多",level:3,chars:41},{id:"guwen_tengwangge",title:"滕王阁序（节选）",author:"王勃",category:"古文名篇",era:"古代",text:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",note:"骈文名句",level:3,chars:34},{id:"guwen_yueyanglou",title:"岳阳楼记（节选）",author:"范仲淹",category:"古文名篇",era:"古代",text:"不以物喜，不以己悲；居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰：先天下之忧而忧，后天下之乐而乐乎。",note:"长篇 · 名句收束",level:2,chars:58},{id:"guwen_ailian",title:"爱莲说（节选）",author:"周敦颐",category:"古文名篇",era:"古代",text:"予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。",note:"托物言志",level:3,chars:42},{id:"guwen_chibifu",title:"赤壁赋（节选）",author:"苏轼",category:"古文名篇",era:"古代",text:"寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。",note:"赋体 · 对偶句",level:4,chars:48},{id:"tang_jingyesi",title:"静夜思",author:"李白",category:"唐诗",era:"古代",text:"床前明月光，疑是地上霜。举头望明月，低头思故乡。",note:"五言绝句 · 20 字",level:1,chars:20},{id:"tang_chunxiao",title:"春晓",author:"孟浩然",category:"唐诗",era:"古代",text:"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。",note:"五言绝句 · 20 字",level:2,chars:20},{id:"tang_dengguanquelou",title:"登鹳雀楼",author:"王之涣",category:"唐诗",era:"古代",text:"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。",note:"五言绝句 · 20 字",level:1,chars:20},{id:"tang_wanglushan",title:"望庐山瀑布",author:"李白",category:"唐诗",era:"古代",text:"日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。",note:"七言绝句 · 28 字",level:2,chars:28},{id:"tang_jueju",title:"绝句",author:"杜甫",category:"唐诗",era:"古代",text:"两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。",note:"七言绝句 · 28 字",level:3,chars:28},{id:"tang_jiangxue",title:"江雪",author:"柳宗元",category:"唐诗",era:"古代",text:"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。",note:"五言绝句 · 20 字",level:3,chars:20},{id:"tang_minnong",title:"悯农",author:"李绅",category:"唐诗",era:"古代",text:"锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。",note:"五言绝句 · 20 字",level:2,chars:20},{id:"song_rumengling",title:"如梦令",author:"李清照",category:"宋词",era:"古代",text:"昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。",note:"小令 · 长短句断行练习",level:3,chars:33},{id:"song_bosuanzi",title:"卜算子",author:"李之仪",category:"宋词",era:"古代",text:"我住长江头，君住长江尾。日日思君不见君，共饮长江水。此水几时休，此恨何时已。只愿君心似我心，定不负相思意。",note:"上下阕 · 重复字多",level:2,chars:45},{id:"song_huanxisha",title:"浣溪沙",author:"晏殊",category:"宋词",era:"古代",text:"一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。",note:"小令 · 对仗句",level:3,chars:42},{id:"meng_sanzijing",title:"三字经（节选）",author:"",category:"蒙学",era:"古代",text:"人之初，性本善。性相近，习相远。苟不教，性乃迁。教之道，贵以专。昔孟母，择邻处。子不学，断机杼。",note:"三字句 · 适合初学",level:2,chars:36},{id:"meng_qianziwen",title:"千字文（节选）",author:"",category:"蒙学",era:"古代",text:"天地玄黄，宇宙洪荒。日月盈昃，辰宿列张。寒来暑往，秋收冬藏。闰余成岁，律吕调阳。",note:"四字句 · 字不重复",level:4,chars:32},{id:"meng_dizigui",title:"弟子规（节选）",author:"",category:"蒙学",era:"古代",text:"弟子规，圣人训。首孝悌，次谨信。泛爱众，而亲仁。有余力，则学文。",note:"三字句 · 结构整齐",level:2,chars:24},{id:"idiom_common",title:"常用成语（一）",author:"",category:"成语",era:"古代",text:"一心一意三思而行四面八方五光十色六神无主七上八下九牛一毛十全十美百发百中千军万马万象更新日新月异",note:"四字格 · 连续临写",level:2,chars:48},{id:"idiom_effort",title:"勤学成语（二）",author:"",category:"成语",era:"古代",text:"业精于勤循序渐进持之以恒温故知新融会贯通举一反三学以致用厚积薄发精益求精水滴石穿",note:"四字格 · 连续临写",level:3,chars:40},{id:"modern_congcong",title:"匆匆（节选）",author:"朱自清",category:"现代散文",era:"现代",text:"燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？",note:"1930 年代白话 · 排比句",level:2,chars:53},{id:"modern_beiying",title:"背影（节选）",author:"朱自清",category:"现代散文",era:"现代",text:"我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去，尚不大难。",note:"动作描写 · 名段",level:2,chars:40},{id:"modern_hetang",title:"荷塘月色（节选）",author:"朱自清",category:"现代散文",era:"现代",text:"曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花。",note:"写景 · 叠词多",level:2,chars:48},{id:"modern_qiuye",title:"秋夜（节选）",author:"鲁迅",category:"现代散文",era:"现代",text:"在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。这上面的夜的天空，奇怪而高，我生平没有见过这样奇怪而高的天空。",note:"《野草》开篇 · 短句",level:2,chars:56},{id:"modern_baicaoyuan",title:"从百草园到三味书屋（节选）",author:"鲁迅",category:"现代散文",era:"现代",text:"不必说碧绿的菜畦，光滑的石井栏，高大的皂荚树，紫红的桑椹；也不必说鸣蝉在树叶里长吟，肥胖的黄蜂伏在菜花上。",note:"不必说句式 · 名段",level:3,chars:47},{id:"modern_jinan",title:"济南的冬天（节选）",author:"老舍",category:"现代散文",era:"现代",text:"设若单单是有阳光，那也算不了出奇。请闭上眼睛想：一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒。",note:"口语化白话 · 温润",level:2,chars:55},{id:"modern_lahuasheng",title:"落花生（节选）",author:"许地山",category:"现代散文",era:"现代",text:"花生的好处很多，有一样最可贵：它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝头上。",note:"借物说理 · 短篇",level:2,chars:47},{id:"modern_gudou",title:"故都的秋（节选）",author:"郁达夫",category:"现代散文",era:"现代",text:"秋天，无论在什么地方的秋天，总是好的；可是啊，北国的秋，却特别地来得清，来得静，来得悲凉。我的不远千里，要从杭州赶上青岛。",note:"开篇 · 长短语交错",level:2,chars:51},{id:"modern_hulanhe",title:"呼兰河传（节选）",author:"萧红",category:"现代散文",era:"现代",text:"严冬一封锁了大地的时候，则大地满地裂着口。从南到北，从东到西，几尺长的，一丈长的，还有好几丈长的，它们毫无方向地，便随时随地只要严冬一到，大地就裂开口了。",note:"北方风物 · 白描",level:2,chars:67},{id:"modern_zaibie",title:"再别康桥（节选）",author:"徐志摩",category:"现代诗歌",era:"现代",text:"轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。那河畔的金柳，是夕阳中的新娘；波光里的艳影，在我的心头荡漾。",note:"新格律诗 · 反复句",level:2,chars:52},{id:"modern_sishui",title:"死水（节选）",author:"闻一多",category:"现代诗歌",era:"现代",text:"这是一沟绝望的死水，清风吹不起半点漪沦！不如多扔些破铜烂铁，爽性泼你的剩菜残羹。也许铜的要绿成翡翠，铁罐上锈出几瓣桃花。",note:"三美主张 · 整齐句",level:3,chars:54},{id:"modern_yuxiang",title:"雨巷（节选）",author:"戴望舒",category:"现代诗歌",era:"现代",text:"撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷，我希望逢着一个丁香一样地结着愁怨的姑娘。她是有丁香一样的颜色，丁香一样的芬芳。",note:"象征派 · 长句",level:3,chars:56},{id:"modern_buxiangta",title:"教我如何不想她（节选）",author:"刘半农",category:"现代诗歌",era:"现代",text:"天上飘着些微云，地上吹着些微风。啊！微风吹动了我头发，教我如何不想她？月光恋爱着海洋，海洋恋爱着月光。",note:"早期白话诗 · 短句",level:2,chars:44},{id:"modern_tici",title:"野草 · 题辞（节选）",author:"鲁迅",category:"现代杂文",era:"现代",text:"当我沉默着的时候，我觉得充实；我将开口，同时感到空虚。过去的生命已经死亡。我对于这死亡有大欢喜，因为我借此知道它曾经存活。",note:"箴言式短句",level:2,chars:54},{id:"modern_chabuduo",title:"差不多先生传（节选）",author:"胡适",category:"现代杂文",era:"现代",text:"你知道中国最有名的人是谁？提起此人，人人皆晓，处处闻名。他姓差，名不多，是各省各县各村人氏。你一定见过他，一定听过别人谈起他。",note:"白话议论 · 反讽",level:2,chars:54}],freq:"的是在了我和有不人也你为他这中与年对就都上说吗会到要来月被还而个后等但于日将并能一很让从以好大她着多时给把去看又或下之过新里做及地由没用更得所想最它那三可吧其该只向前出啊已再小当们内却才爱第谁号事快比跟请长呢高则至钱万使像点听此起两自国如带走吃岁无话较么区太家约者开问站元写因成打分死见买叫图曾即道天总另应正便党间发名干本达找称您玩县受真进处女每种各市位作未次省网老外经副马美行路连制拿仍军同哪先占台杀二住学据非书亦别回心讲反条送啦版性指均期法全变米共水生派搞车原手类级些场型按线亿哦报男若跑靠加少拉队且低拍放系门完式穿笑西近金属强越选难任办四张抓谈转东仅动卖字帮狗黑届早相花部黄主子段件信关提算
